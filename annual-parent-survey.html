<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Annual Parent Survey</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <img class="logo" src="CougarLogo.jpg" alt="Countryside Cougars Logo">
  <h1>Countryside Elementary School</h1>
  <p>Home of the Countryside Cougars</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="school-news.html">School News</a>
  <a href="school-calendar.html">School Calendar</a>
  <a href="parent-handbook.html">Parent Handbook</a>
  <a href="annual-parent-survey.html">Annual Parent Survey</a>
  <a href="lunch-menu.html">Lunch Menu</a>
  <a href="contact.html">Contact Us Form</a>
</nav>

<div class="container">
  <div class="section">
    <h2>Annual Parent Survey</h2>
    <p>Please complete this sample survey to help us improve our school.</p>

    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name">

      <label for="grade">Student Grade</label>
      <select id="grade" name="grade">
        <option>Pre-K</option>
        <option>Kindergarten</option>
        <option>1st Grade</option>
        <option>2nd Grade</option>
        <option>3rd Grade</option>
        <option>4th Grade</option>
        <option>5th Grade</option>
      </select>

      <label for="rating">Overall School Experience</label>
      <select id="rating" name="rating">
        <option>Excellent</option>
        <option>Good</option>
        <option>Fair</option>
        <option>Needs Improvement</option>
      </select>

      <label for="comments">Comments</label>
      <textarea id="comments" name="comments" rows="5" placeholder="Share your feedback"></textarea>

      <button type="submit">Submit Survey</button>
    </form>
  </div>
</div>

<footer>
  <p>© 2026 Countryside Elementary School</p>
</footer>

</body>
</html>
